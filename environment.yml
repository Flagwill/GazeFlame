# GazeFlame — GazeTR + FLAME_PyTorch 合并项目的 conda 环境定义
#
# 创建环境:
#   conda env create -f environment.yml
# 或（若环境已存在，仅更新依赖）:
#   conda env update -f environment.yml
#
# 注意: FLAME_PyTorch 依赖较老, 使用 Python 3.8 以匹配其设计目标。
# 若 pyrender==0.1.39 在安装时编译失败, 可放宽为 pyrender (最新版 API 兼容)。

name: gaze_flame
channels:
  - conda-forge

dependencies:
  - python=3.8
  - pip
  # dlib (人脸检测/对齐, ETH-XGaze 官方同款):
  #   注意: conda-forge 的 dlib 会把 numpy 升到 1.24+, 而 trimesh 3.6.18 需要
  #   numpy 1.23.5 (np.bool 等别名)。创建/更新环境后请务必执行:
  #     pip install --force-reinstall numpy==1.23.5
  - dlib
  - pip:
      # 版本说明:
#   - numpy 1.23.5: 满足 torch 2.4.1 (需>=1.21) 且保留 np.bool 等别名 (1.24 移除),
#     trimesh 3.6.18 依赖这些别名才能 import
#   - torch 2.4.1: Python 3.8 可用, 无 NVIDIA GPU 时自动退化为 CPU 运行
      - numpy==1.23.5
      - torch
      - torchvision
      - pyrender==0.1.39
      - trimesh==3.6.18
      - smplx
      - opencv-python
      - matplotlib
      - PyYAML
      - easydict
      - git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git